name: Android Build and QA

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WORK_ROOT: ${{ github.workspace }}/.work
      GRADLE_USER_HOME: ${{ github.workspace }}/.work/gradle-home
      ANDROID_HOME: ${{ github.workspace }}/.work/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.work/android-sdk
      TMPDIR: ${{ github.workspace }}/.work/tmp
      TMP: ${{ github.workspace }}/.work/tmp
      TEMP: ${{ github.workspace }}/.work/tmp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create workspace-local tool directories
        run: mkdir -p "$WORK_ROOT" "$GRADLE_USER_HOME" "$ANDROID_HOME" "$TMPDIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android 36 build components
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests, lint and debug APK build
        working-directory: CircleToSearchForXiaomi
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --project-cache-dir "$WORK_ROOT/gradle-project-cache" \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Verify APK package and SHA-256
        working-directory: CircleToSearchForXiaomi
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep "package: name='dev.shovo.circlesearch'"
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: circle-to-search-xiaomi-debug-apk
          path: CircleToSearchForXiaomi/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Remove workspace-local temporary SDK and caches
        if: always()
        run: rm -rf "$WORK_ROOT"
