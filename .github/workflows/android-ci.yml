name: Android Build and QA
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-qa-master
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WORK_ROOT: ${{ github.workspace }}/.work
      GRADLE_USER_HOME: ${{ github.workspace }}/.work/gradle-home
      ANDROID_HOME: ${{ github.workspace }}/.work/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.work/android-sdk
      TMPDIR: ${{ github.workspace }}/.work/tmp
      TMP: ${{ github.workspace }}/.work/tmp
      TEMP: ${{ github.workspace }}/.work/tmp
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Create workspace-local tool directories
        run: mkdir -p "$WORK_ROOT" "$GRADLE_USER_HOME" "$ANDROID_HOME" "$TMPDIR"
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android 36 build components
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests, lint and debug APK build
        working-directory: CircleToSearchForXiaomi
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --project-cache-dir "$WORK_ROOT/gradle-project-cache" :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify unit-test XML results
        working-directory: CircleToSearchForXiaomi
        run: |
          python3 -c 'import glob,xml.etree.ElementTree as E; files=glob.glob("app/build/test-results/testDebugUnitTest/*.xml"); suites=[s for p in files for s in ([E.parse(p).getroot()] if E.parse(p).getroot().tag=="testsuite" else E.parse(p).getroot().findall("testsuite"))]; total=sum(int(s.get("tests",0)) for s in suites); failures=sum(int(s.get("failures",0)) for s in suites); errors=sum(int(s.get("errors",0)) for s in suites); skipped=sum(int(s.get("skipped",0)) for s in suites); print(f"UNIT_TESTS={total} FAILURES={failures} ERRORS={errors} SKIPPED={skipped}"); assert total==5 and failures==0 and errors==0 and skipped==0'
      - name: Verify APK metadata, signature, alignment and size
        working-directory: CircleToSearchForXiaomi
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee "$WORK_ROOT/apk-badging.txt"
          grep "package: name='dev.shovo.circlesearch' versionCode='4' versionName='1.1.0'" "$WORK_ROOT/apk-badging.txt"
          grep "application-label:'Circle to Search for Xiaomi'" "$WORK_ROOT/apk-badging.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          stat -c 'APK_SIZE_BYTES=%s' "$APK"
          sha256sum "$APK"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: circle-to-search-xiaomi-debug-apk
          path: CircleToSearchForXiaomi/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
      - name: Remove workspace-local temporary SDK and caches
        if: always()
        run: rm -rf "$WORK_ROOT"
